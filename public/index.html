<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Helix &mdash; Online</title>
    <style>
        :root {
            --bg: #090d16;
            --card-bg: rgba(18, 24, 38, 0.7);
            --card-border: rgba(255, 255, 255, 0.08);
            --accent-cyan: #38bdf8;
            --accent-purple: #818cf8;
            --accent-green: #34d399;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background-color: var(--bg);
            background-image:
                    radial-gradient(ellipse 80% 50% at 50% -20%, rgba(56, 189, 248, 0.15), transparent 70%),
                    radial-gradient(ellipse 60% 40% at 50% 120%, rgba(129, 140, 248, 0.1), transparent 70%);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 640px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 2rem;
        }

        /* Badge */
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.35rem 0.85rem;
            border-radius: 9999px;
            background: rgba(52, 211, 153, 0.1);
            border: 1px solid rgba(52, 211, 153, 0.25);
            color: var(--accent-green);
            font-size: 0.8125rem;
            font-weight: 500;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: var(--accent-green);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--accent-green);
            animation: pulse 2s infinite ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.85); }
        }

        /* Header */
        .title-group h1 {
            font-size: 3.5rem;
            font-weight: 800;
            letter-spacing: -0.04em;
            line-height: 1.1;
            margin-bottom: 0.75rem;
            background: linear-gradient(135deg, #ffffff 40%, var(--accent-cyan) 80%, var(--accent-purple) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .title-group p {
            color: var(--text-muted);
            font-size: 1.125rem;
            line-height: 1.6;
            max-width: 480px;
            margin: 0 auto;
        }

        /* Spec / Telemetry Card */
        .telemetry-card {
            width: 100%;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 1.25rem 1.5rem;
            backdrop-filter: blur(12px);
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
            text-align: left;
        }

        .telemetry-header {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-muted);
            margin-bottom: 0.85rem;
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 0.5rem;
        }

        .telemetry-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 0.875rem;
        }

        .telemetry-item {
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
        }

        .telemetry-label {
            color: var(--text-muted);
            font-size: 0.75rem;
        }

        .telemetry-val {
            color: var(--text-main);
            font-weight: 500;
        }

        /* Footnote */
        .footer {
            color: var(--text-muted);
            font-size: 0.8125rem;
            display: flex;
            gap: 1.5rem;
        }

        .footer a {
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.15s ease;
        }

        .footer a:hover {
            color: var(--accent-cyan);
        }
    </style>
</head>
<body>
<main class="container">

    <div class="status-badge">
        <span class="status-dot"></span>
        Running Active
    </div>

    <div class="title-group">
        <h1>Helix</h1>
        <p>The server is operational and actively serving HTTP/TCP requests from this host.</p>
    </div>

    <div class="telemetry-card">
        <div class="telemetry-header">
            <span>Runtime Environment</span>
            <span>Standard Output</span>
        </div>
        <div class="telemetry-grid">
            <div class="telemetry-item">
                <span class="telemetry-label">Engine</span>
                <span class="telemetry-val">Helix Core / 1.0.0</span>
            </div>
            <div class="telemetry-item">
                <span class="telemetry-label">State</span>
                <span class="telemetry-val" style="color: var(--accent-green);">Ready</span>
            </div>
            <div class="telemetry-item">
                <span class="telemetry-label">Socket</span>
                <span class="telemetry-val">Listening (0.0.0.0)</span>
            </div>
            <div class="telemetry-item">
                <span class="telemetry-label">Protocol</span>
                <span class="telemetry-val">HTTP/1.1</span>
            </div>
        </div>
    </div>

    <footer class="footer">
        <span>Place documents in your public directory</span>
    </footer>

</main>
</body>
</html>
